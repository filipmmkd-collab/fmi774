<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATED BY fmi774</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="dynamic-theme">
        :root {
            --page-bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-color: #f1f5f9;
            --muted-color: #94a3b8;
            --border-color: #334155;
            --base-font-size: 16px;
            --card-radius: 16px;
            --grid-columns: 3;
        }
    </style>
    <style>
        html { font-size: var(--base-font-size); }
        body { background-color: var(--page-bg); color: var(--text-color); }
        .card-bg-real { background-color: var(--card-bg); }
        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-border { border-color: var(--accent); }
        .muted-text { color: var(--muted-color); }
        .border-themed { border-color: var(--border-color); }
        .card-radius { border-radius: var(--card-radius); }
        .grid-custom { grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr)); }
        .link-card-img { transition: transform 0.3s ease, filter 0.3s ease; }
        .link-card-img:hover { transform: scale(1.03); filter: brightness(1.1); }
        .link-overlay { background: linear-gradient(135deg, rgba(0,0,0,0.1), rgba(0,0,0,0.5)); }
        .link-overlay:hover { background: linear-gradient(135deg, rgba(0,0,0,0.2), rgba(0,0,0,0.6)); }
        .play-btn { transition: transform 0.2s ease, opacity 0.2s ease; }
        .link-card-wrapper:hover .play-btn { transform: scale(1.15); }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.3s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        input[type="color"] { -webkit-appearance: none; border: none; cursor: pointer; border-radius: 8px; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 8px; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border-color); border-radius: 8px; }
        input[type="range"] { -webkit-appearance: none; height: 6px; border-radius: 3px; background: var(--border-color); outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        .music-player { animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .glow-text {
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 40px var(--accent);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 40px var(--accent); }
            50% { text-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent), 0 0 60px var(--accent); }
        }
        .glow-card { transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.4s ease; }
        .glow-card:hover {
            box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(59,130,246,0.3);
            transform: translateY(-4px);
        }
        .glow-btn {
            box-shadow: 0 0 15px var(--accent), 0 0 30px rgba(59,130,246,0.4);
            animation: glowPulse 3s ease-in-out infinite;
        }
    </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body class="font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white" id="app-body">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Theme Customization Panel (Admin Only) -->
    <div id="theme-panel" class="fixed top-0 right-0 h-full w-80 z-50 card-bg-real border-l border-themed shadow-2xl overflow-y-auto transform translate-x-full transition-transform duration-300 hidden">
        <div class="p-6 space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold accent-text"><i class="fa-solid fa-palette"></i> Customize</h3>
                <button onclick="toggleThemePanel()" class="text-slate-400 hover:text-white w-9 h-9 rounded-lg card-bg-real border border-themed flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold muted-text">Page Background Color</label>
                <input type="color" id="theme-page-bg" value="#0f172a" class="w-full h-10 rounded-lg" oninput="applyTheme()">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold muted-text">Card Background Color</label>
                <input type="color" id="theme-card-bg" value="#1e293b" class="w-full h-10 rounded-lg" oninput="applyTheme()">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold muted-text">Accent Color</label>
                <input type="color" id="theme-accent" value="#3b82f6" class="w-full h-10 rounded-lg" oninput="applyTheme()">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold muted-text">Text Color</label>
                <input type="color" id="theme-text" value="#f1f5f9" class="w-full h-10 rounded-lg" oninput="applyTheme()">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-semibold muted-text">Muted Text Color</label>
                <input type="color" id="theme-muted" value="#94a3b8" class="w-full h-10 rounded-lg" oninput="applyTheme()">
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold muted-text">Font Size: <span id="font-size-val" class="accent-text">16px</span></label>
                <input type="range" id="theme-font-size" min="12" max="24" value="16" class="w-full" oninput="applyTheme()">
            </div>

            <button onclick="resetTheme()" class="w-full py-2.5 rounded-lg border border-themed text-sm font-medium hover:bg-slate-700 transition">
                <i class="fa-solid fa-rotate-left"></i> Reset to Defaults
            </button>
        </div>
    </div>

    <!-- Hero Section -->
    <header id="hero-section" class="min-h-screen flex flex-col justify-center p-6 md:p-12 relative border-b border-themed">
        <div id="hero-content" class="text-center max-w-3xl mx-auto my-auto space-y-6">
            <div id="title-wrapper" class="relative inline-block">
                <h1 id="hero-title" class="text-5xl md:text-7xl font-extrabold tracking-tight glow-text outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 cursor-default" contenteditable="false">
                    CREATED BY fmi774
                </h1>
                <button id="title-edit-btn" onclick="openTitleSettings()" class="hidden absolute -top-3 -right-3 z-20 w-8 h-8 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Title Settings">
                    <i class="fa-solid fa-sliders text-xs"></i>
                </button>
            </div>
            <p id="hero-desc" class="hidden" contenteditable="false"></p>
            <div id="hero-links-container" class="flex flex-wrap items-center justify-center gap-4">
            </div>
            <div id="hero-image-admin-controls" class="hidden">
                <button onclick="openHeroImageModal()" class="text-sm border border-themed hover:accent-bg hover:text-white px-4 py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-plus"></i> Add New Link
                </button>
            </div>
            <div>
                <a href="#modules-section" class="inline-flex items-center gap-2 accent-bg hover:opacity-90 text-white font-medium px-8 py-4 rounded-full transition-all glow-btn group">
                    <span>ENTER</span>
                    <i class="fa-solid fa-arrow-down group-hover:translate-y-1 transition-transform"></i>
                </a>
            </div>
            <div id="hero-music-controls" class="hidden">
                <div class="inline-flex items-center gap-3 card-bg-real border border-themed rounded-2xl shadow-xl px-4 py-3 max-w-sm mx-auto">
                    <button onclick="togglePlayMusic()" id="play-pause-btn-2" class="w-9 h-9 rounded-full accent-bg text-white flex items-center justify-center hover:opacity-80 transition shrink-0">
                        <i class="fa-solid fa-play" id="play-icon-2"></i>
                    </button>
                    <div class="flex flex-col min-w-[120px] flex-1">
                        <span id="now-playing-title-2" class="text-xs font-semibold truncate max-w-[180px]">No song loaded</span>
                        <input type="range" id="music-seek-2" min="0" max="100" value="0" class="w-full mt-1 h-1" oninput="seekMusic(2)">
                    </div>
                    <button onclick="shuffleMusic()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center transition shrink-0" title="Shuffle">
                        <i class="fa-solid fa-shuffle text-sm"></i>
                    </button>
                    <button onclick="nextSong()" class="text-slate-400 hover:text-white w-8 h-8 flex items-center justify-center transition shrink-0" title="Next">
                        <i class="fa-solid fa-forward-step text-sm"></i>
                    </button>
                    <div class="flex items-center gap-1 shrink-0">
                        <i class="fa-solid fa-volume-low text-xs muted-text"></i>
                        <input type="range" id="music-volume-2" min="0" max="100" value="70" class="w-16 h-1" oninput="setVolume(2)">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="modules-section" class="flex-grow p-6 md:p-12 max-w-7xl mx-auto w-full">
        <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
            <h2 class="text-2xl md:text-3xl font-bold tracking-tight flex items-center gap-3">
                <i class="fa-solid fa-layer-group accent-text"></i> MODULES
            </h2>
            <div class="flex items-center gap-3">
                <button id="theme-btn" onclick="toggleThemePanel()" class="hidden items-center gap-2 border border-themed hover:accent-bg hover:text-white px-4 py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-palette"></i> Customize
                </button>
                <button id="music-btn" onclick="toggleMusicPanel()" class="hidden items-center gap-2 border border-themed hover:accent-bg hover:text-white px-4 py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-music"></i> Music
                </button>
                <button id="add-item-btn" onclick="openAddModal()" class="hidden items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium transition shadow">
                    <i class="fa-solid fa-plus"></i> Add Module
                </button>
                <button id="hero-img-btn" onclick="openHeroImageModal()" class="hidden items-center gap-2 border border-themed hover:accent-bg hover:text-white px-4 py-2 rounded-lg font-medium transition">
                    <i class="fa-solid fa-image"></i> Hero Image
                </button>
            </div>
        </div>

        <!-- Link Cards Grid -->
        <div id="modules-grid" class="grid grid-custom gap-6">
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-themed text-center py-6 text-sm muted-text">
        <p class="font-semibold tracking-wide">Built by FMI774</p>
    </footer>

    <!-- Admin Floating Button -->
    <button onclick="handleAdminClick()" class="fixed bottom-6 right-6 z-40 card-bg-real hover:opacity-80 text-slate-200 border border-themed p-4 rounded-full shadow-2xl flex items-center justify-center transition group" title="Admin Mode">
        <i class="fa-solid fa-lock text-lg group-hover:scale-110 transition-transform" id="admin-icon"></i>
    </button>

    <audio id="bg-audio"></audio>

    <!-- Modal: Item Detail View -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto">
        <div class="card-bg-real border border-themed w-full max-w-3xl rounded-2xl p-6 md:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="detail-content" class="space-y-6 mt-2"></div>
        </div>
    </div>

    <!-- Modal: Add/Edit Link Card -->
    <div id="add-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card-bg-real border border-themed w-full max-w-lg rounded-2xl p-6 md:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeAddModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white"><i class="fa-solid fa-link accent-text"></i> <span id="add-modal-title">Add Module</span></h3>
            <form id="add-form" onsubmit="handleSaveItem(event)" class="space-y-4">
                <input type="hidden" id="edit-index" value="-1">
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Title *</label>
                    <input type="text" id="item-title" required class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="Card title">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Description *</label>
                    <textarea id="item-desc" rows="2" required class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="Short description shown on the card"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Link URL * <span class="text-xs muted-text">(hidden inside the image — clicking the image opens this)</span></label>
                    <input type="url" id="item-link" required class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="https://tiktok.com/@yourname or https://youtube.com/watch?v=...">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Image URL * <span class="text-xs muted-text">(the thumbnail/cover for the link)</span></label>
                    <input type="url" id="item-image" required class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="https://example.com/image.jpg" oninput="previewCardImage()">
                    <p class="text-xs muted-text mt-1">Paste a direct image URL. The link URL stays hidden — only the image is visible.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Image Size</label>
                    <select id="item-img-size" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500">
                        <option value="small">Small (180px tall)</option>
                        <option value="medium" selected>Medium (280px tall)</option>
                        <option value="large">Large (400px tall)</option>
                        <option value="full">Full width (450px tall)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Link Type (overlay icon)</label>
                    <select id="item-link-type" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500">
                        <option value="play" selected>Play button (video link)</option>
                        <option value="link">Link icon (web page)</option>
                        <option value="music">Music icon (audio link)</option>
                        <option value="image">Image icon (photo link)</option>
                        <option value="none">No icon</option>
                    </select>
                </div>
                <div id="image-preview-container" class="hidden">
                    <label class="block text-sm font-medium muted-text mb-1">Preview</label>
                    <img id="image-preview" class="w-full max-h-40 object-cover rounded-lg border border-themed" alt="Preview">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition shadow">
                    <span id="save-btn-text">Save Link Card</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Music Manager -->
    <div id="music-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card-bg-real border border-themed w-full max-w-md rounded-2xl p-6 md:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeMusicModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white"><i class="fa-solid fa-music accent-text"></i> Music Manager</h3>
            <div class="space-y-4">
                <div id="music-songs-list" class="space-y-2">
                </div>
                <hr class="border-themed">
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Add Song — URL (mp3, wav, etc.)</label>
                    <input type="url" id="music-url" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="https://example.com/song.mp3">
                </div>
                <div class="text-center text-sm muted-text">— or —</div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Upload Audio File</label>
                    <input type="file" id="music-file" accept="audio/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-500 file:text-white hover:file:bg-blue-600 cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Song Title (optional)</label>
                    <input type="text" id="music-title" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="e.g. My Favorite Beat">
                </div>
                <button onclick="addSong()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition shadow">
                    <i class="fa-solid fa-plus"></i> Add Song
                </button>
                <button onclick="toggleShuffleMode()" id="shuffle-toggle-btn" class="w-full border border-themed hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-lg transition text-sm">
                    <i class="fa-solid fa-shuffle"></i> Shuffle: <span id="shuffle-status">Off</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Hero Link (Add/Edit) -->
    <div id="hero-image-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card-bg-real border border-themed w-full max-w-md rounded-2xl p-6 md:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeHeroImageModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white"><i class="fa-solid fa-link accent-text"></i> <span id="hero-modal-title">Add New Link</span></h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Image URL *</label>
                    <input type="url" id="hero-img-url" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="https://example.com/image.jpg" oninput="previewHeroImage()">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Link URL (where clicking the image goes)</label>
                    <input type="url" id="hero-img-link" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="https://tiktok.com/@yourname">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Image Width: <span id="hero-img-width-val" class="accent-text">120px</span></label>
                    <input type="range" id="hero-img-width" min="60" max="300" value="120" step="10" class="w-full" oninput="document.getElementById('hero-img-width-val').innerText = this.value + 'px'">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Image Height: <span id="hero-img-height-val" class="accent-text">120px</span></label>
                    <input type="range" id="hero-img-height" min="60" max="300" value="120" step="10" class="w-full" oninput="document.getElementById('hero-img-height-val').innerText = this.value + 'px'">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Shape</label>
                    <div class="flex gap-2">
                        <button onclick="setHeroImgShape('circle')" class="flex-1 py-2 rounded-lg border border-themed text-sm hover:accent-bg hover:text-white transition" id="hero-img-shape-circle-btn"><i class="fa-solid fa-circle"></i> Circle</button>
                        <button onclick="setHeroImgShape('square')" class="flex-1 py-2 rounded-lg border border-themed text-sm hover:accent-bg hover:text-white transition" id="hero-img-shape-square-btn"><i class="fa-solid fa-square"></i> Square</button>
                    </div>
                </div>
                <div id="hero-img-preview-container" class="hidden">
                    <label class="block text-sm font-medium muted-text mb-1">Preview</label>
                    <img id="hero-img-preview" class="object-cover border border-themed" alt="Preview" style="border-radius:50%; width:120px; height:120px;">
                </div>
                <input type="hidden" id="hero-img-edit-index" value="-1">
                <button onclick="saveHeroImage()" class="w-full accent-bg hover:opacity-90 text-white font-medium py-3 rounded-lg transition shadow">
                    <i class="fa-solid fa-check"></i> <span id="hero-save-btn-text">Add Link</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Title Settings -->
    <div id="title-settings-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card-bg-real border border-themed w-full max-w-md rounded-2xl p-6 md:p-8 relative shadow-2xl">
            <button onclick="closeTitleSettings()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white"><i class="fa-solid fa-text-height accent-text"></i> Title Settings</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Title Text</label>
                    <input type="text" id="title-text-input" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="CREATED BY fmi774">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Font Size: <span id="title-font-size-val" class="accent-text">72px</span></label>
                    <input type="range" id="title-font-size" min="24" max="120" value="72" step="4" class="w-full" oninput="document.getElementById('title-font-size-val').innerText = this.value + 'px'">
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Text Alignment</label>
                    <div class="flex gap-2">
                        <button onclick="setTitleAlign('left')" class="flex-1 py-2 rounded-lg border border-themed text-sm hover:accent-bg hover:text-white transition" id="title-align-left-btn"><i class="fa-solid fa-align-left"></i></button>
                        <button onclick="setTitleAlign('center')" class="flex-1 py-2 rounded-lg border border-themed text-sm hover:accent-bg hover:text-white transition" id="title-align-center-btn"><i class="fa-solid fa-align-center"></i></button>
                        <button onclick="setTitleAlign('right')" class="flex-1 py-2 rounded-lg border border-themed text-sm hover:accent-bg hover:text-white transition" id="title-align-right-btn"><i class="fa-solid fa-align-right"></i></button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Vertical Position</label>
                    <select id="title-pos-select" class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                        <option value="top">Top of page</option>
                        <option value="center" selected>Centered vertically</option>
                        <option value="bottom">Bottom of page</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium muted-text mb-1">Move Up/Down: <span id="title-margin-val" class="accent-text">0px</span></label>
                    <input type="range" id="title-margin" min="-200" max="200" value="0" step="10" class="w-full" oninput="document.getElementById('title-margin-val').innerText = this.value + 'px'">
                </div>
                <button onclick="saveTitleSettings()" class="w-full accent-bg hover:opacity-90 text-white font-medium py-3 rounded-lg transition shadow">
                    <i class="fa-solid fa-check"></i> Save Title Settings
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Password Prompt -->
    <div id="password-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card-bg-real border border-themed w-full max-w-sm rounded-2xl p-6 relative shadow-2xl text-center">
            <h3 id="pwd-modal-title" class="text-lg font-bold mb-2 text-white">Enter Admin Password</h3>
            <p id="pwd-modal-desc" class="text-sm muted-text mb-4">Please input your admin password.</p>
            <form onsubmit="handlePasswordSubmit(event)" class="space-y-4">
                <input type="password" id="password-input" required placeholder="Password..." class="w-full bg-slate-900 border border-themed rounded-lg px-4 py-2.5 text-white text-center focus:outline-none focus:border-blue-500">
                <div class="flex gap-2">
                    <button type="button" onclick="closePasswordModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-lg font-medium transition">Cancel</button>
                    <button type="submit" class="flex-1 accent-bg hover:opacity-90 text-white py-2.5 rounded-lg font-medium transition">Confirm</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== State =====
        let isAdmin = false;
        let items = JSON.parse(localStorage.getItem('hub_items')) || [];
        let siteConfig = JSON.parse(localStorage.getItem('hub_config')) || {
            title: "CREATED BY fmi774",
            desc: "",
            headerAlign: "center",
            headerPos: "center"
        };
        let themeConfig = JSON.parse(localStorage.getItem('hub_theme')) || {
            pageBg: '#0f172a', cardBg: '#1e293b', accent: '#3b82f6',
            text: '#f1f5f9', muted: '#94a3b8', border: '#334155',
            fontSize: 16, radius: 16, columns: 3
        };
        let musicConfig = JSON.parse(localStorage.getItem('hub_music')) || { songs: [], shuffle: false, volume: 70 };
        let heroLinks = JSON.parse(localStorage.getItem('hub_hero_links')) || [];
        let currentSongIndex = 0;
        let titleConfig = JSON.parse(localStorage.getItem('hub_title_config')) || { fontSize: 72, align: 'center', pos: 'center', marginTop: 0 };
        let pendingPasswordAction = null;
        let editingIndex = -1;

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            renderConfig();
            renderItems();
            loadMusicState();
            renderHeroLinks();
        });

        // ===== Toast =====
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-blue-600' };
            const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
            toast.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 slide-in`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]}"></i><span class="text-sm font-medium">${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ===== Theme =====
        function loadTheme() {
            const t = themeConfig;
            const root = document.documentElement;
            root.style.setProperty('--page-bg', t.pageBg);
            root.style.setProperty('--card-bg', t.cardBg);
            root.style.setProperty('--accent', t.accent);
            root.style.setProperty('--text-color', t.text);
            root.style.setProperty('--muted-color', t.muted);
            root.style.setProperty('--border-color', t.border || '#334155');
            root.style.setProperty('--base-font-size', t.fontSize + 'px');
            root.style.setProperty('--card-radius', t.radius + 'px');
            root.style.setProperty('--grid-columns', t.columns);

            const tp = document.getElementById('theme-page-bg'); if (tp) tp.value = t.pageBg;
            const tc = document.getElementById('theme-card-bg'); if (tc) tc.value = t.cardBg;
            const ta = document.getElementById('theme-accent'); if (ta) ta.value = t.accent;
            const tt = document.getElementById('theme-text'); if (tt) tt.value = t.text;
            const tm = document.getElementById('theme-muted'); if (tm) tm.value = t.muted;
            const tf = document.getElementById('theme-font-size'); if (tf) { tf.value = t.fontSize; document.getElementById('font-size-val').innerText = t.fontSize + 'px'; }
            const tr = document.getElementById('theme-radius'); if (tr) { tr.value = t.radius; document.getElementById('radius-val').innerText = t.radius + 'px'; }
            const tcol = document.getElementById('theme-columns'); if (tcol) { tcol.value = t.columns; document.getElementById('cols-val').innerText = t.columns; }

            applyHeaderLayout();
            applyTitleConfig();
        }

        function applyTheme() {
            const t = {
                pageBg: document.getElementById('theme-page-bg').value,
                cardBg: document.getElementById('theme-card-bg').value,
                accent: document.getElementById('theme-accent').value,
                text: document.getElementById('theme-text').value,
                muted: document.getElementById('theme-muted').value,
                border: shadeColor(document.getElementById('theme-card-bg').value, -15),
                fontSize: parseInt(document.getElementById('theme-font-size').value),
                radius: parseInt(document.getElementById('theme-radius').value),
                columns: parseInt(document.getElementById('theme-columns').value)
            };
            themeConfig = t;
            document.getElementById('font-size-val').innerText = t.fontSize + 'px';
            document.getElementById('radius-val').innerText = t.radius + 'px';
            document.getElementById('cols-val').innerText = t.columns;
            loadTheme();
            saveTheme();
        }

        function saveTheme() {
            localStorage.setItem('hub_theme', JSON.stringify(themeConfig));
        }

        function resetTheme() {
            themeConfig = { pageBg: '#0f172a', cardBg: '#1e293b', accent: '#3b82f6', text: '#f1f5f9', muted: '#94a3b8', border: '#334155', fontSize: 16, radius: 16, columns: 3 };
            saveTheme();
            loadTheme();
            showToast("Theme reset to defaults.", "info");
        }

        function shadeColor(hex, percent) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            r = Math.max(0, Math.min(255, r + Math.round(r * percent / 100)));
            g = Math.max(0, Math.min(255, g + Math.round(g * percent / 100)));
            b = Math.max(0, Math.min(255, b + Math.round(b * percent / 100)));
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
        }

        function toggleThemePanel() {
            const panel = document.getElementById('theme-panel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                setTimeout(() => panel.classList.remove('translate-x-full'), 10);
            } else {
                panel.classList.add('translate-x-full');
                setTimeout(() => panel.classList.add('hidden'), 300);
            }
        }

        function setHeaderAlign(align) {
            siteConfig.headerAlign = align;
            localStorage.setItem('hub_config', JSON.stringify(siteConfig));
            applyHeaderLayout();
        }

        function applyHeaderLayout() {
            const content = document.getElementById('hero-content');
            const align = siteConfig.headerAlign || 'center';
            content.classList.remove('text-left', 'text-center', 'text-right');
            content.classList.add('text-' + align);
            ['align-left-btn', 'align-center-btn', 'align-right-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.classList.remove('accent-bg', 'text-white');
            });
            const activeBtn = document.getElementById('align-' + align + '-btn');
            if (activeBtn) activeBtn.classList.add('accent-bg', 'text-white');

            const hero = document.getElementById('hero-section');
            const pos = document.getElementById('theme-header-pos');
            if (pos) pos.value = siteConfig.headerPos || 'center';
            if ((siteConfig.headerPos || 'center') === 'top') {
                hero.classList.remove('justify-center');
                hero.classList.add('justify-start', 'pt-20');
            } else {
                hero.classList.remove('justify-start', 'pt-20');
                hero.classList.add('justify-center');
            }
        }

        // ===== Config / Header =====
        function renderConfig() {
            document.getElementById('hero-title').innerText = siteConfig.title;
            document.getElementById('hero-desc').innerText = siteConfig.desc;
            applyHeaderLayout();
            applyTitleConfig();
        }

        // ===== Render Cards =====
        const imgSizes = { small: '180px', medium: '280px', large: '400px', full: '450px' };
        const linkIcons = { play: 'fa-circle-play', link: 'fa-up-right-from-square', music: 'fa-music', image: 'fa-image', none: '' };

        function renderItems() {
            const grid = document.getElementById('modules-grid');
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 muted-text border border-dashed border-themed card-radius">
                        <i class="fa-solid fa-box-open text-4xl mb-3"></i>
                        <p>No modules yet. Switch to admin mode to add one.</p>
                    </div>`;
                return;
            }
            grid.innerHTML = items.map((item, index) => {
                const h = imgSizes[item.imgSize] || imgSizes.medium;
                const iconClass = linkIcons[item.linkType] || linkIcons.play;
                const showIcon = item.linkType && item.linkType !== 'none';
                return `
                <div class="card-bg-real border border-themed hover:accent-border card-radius overflow-hidden transition-all group relative shadow-lg fade-in glow-card" style="animation-delay:${index * 0.05}s">
                    ${isAdmin ? `
                        <div class="absolute top-3 right-3 z-20 flex gap-2">
                            <button onclick="moveItem(${index}, -1)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Move left">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                            <button onclick="moveItem(${index}, 1)" class="w-8 h-8 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Move right">
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                            <button onclick="editItem(${index})" class="w-8 h-8 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Edit">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteItem(${index})" class="w-8 h-8 rounded-full bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white flex items-center justify-center transition" title="Delete">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    ` : ''}
                    <a href="${escapeAttr(item.link)}" target="_blank" rel="noopener noreferrer" class="link-card-wrapper relative block overflow-hidden">
                        <div class="relative overflow-hidden" style="height:${h}">
                            <img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.title)}" class="link-card-img w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.pexels.com/photos/1749822/pexels-photo-1749822.jpeg?auto=compress&cs=tinysrgb&h=650&w=940'">
                            <div class="link-overlay absolute inset-0 flex items-center justify-center">
                                ${showIcon ? `<i class="fa-solid ${iconClass} text-5xl text-white drop-shadow-lg play-btn opacity-90"></i>` : ''}
                            </div>
                        </div>
                    </a>
                    <div class="p-5">
                        <h3 class="text-lg font-bold mb-1 group-hover:accent-text transition-colors">${escapeHtml(item.title)}</h3>
                        <p class="muted-text text-sm line-clamp-2">${escapeHtml(item.desc)}</p>
                    </div>
                </div>`;
            }).join('');
        }

        // ===== Admin / Password =====
        async function sha256(message) {
            const buf = new TextEncoder().encode(message);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function handleAdminClick() {
            const storedHash = localStorage.getItem('hub_admin_pwd');
            if (!storedHash) openPasswordSetupModal();
            else openPasswordVerifyModal();
        }

        function openPasswordSetupModal() {
            document.getElementById('pwd-modal-title').innerText = "Set Admin Password";
            document.getElementById('pwd-modal-desc').innerText = "Create a master password for managing content.";
            document.getElementById('password-input').value = "";
            const m = document.getElementById('password-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
            pendingPasswordAction = 'setup';
        }

        function openPasswordVerifyModal() {
            document.getElementById('pwd-modal-title').innerText = "Enter Admin Password";
            document.getElementById('pwd-modal-desc').innerText = "Input password to toggle Admin mode.";
            document.getElementById('password-input').value = "";
            const m = document.getElementById('password-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
            pendingPasswordAction = 'verify';
        }

        function closePasswordModal() {
            const m = document.getElementById('password-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        async function handlePasswordSubmit(e) {
            e.preventDefault();
            const val = document.getElementById('password-input').value;
            const hash = await sha256(val);
            if (pendingPasswordAction === 'setup') {
                localStorage.setItem('hub_admin_pwd', hash);
                closePasswordModal();
                enableAdminMode();
                showToast("Admin password set successfully!");
            } else if (pendingPasswordAction === 'verify') {
                if (hash === localStorage.getItem('hub_admin_pwd')) {
                    closePasswordModal();
                    toggleAdminState();
                } else {
                    showToast("Incorrect password!", "error");
                }
            }
        }

        function toggleAdminState() {
            isAdmin = !isAdmin;
            const icon = document.getElementById('admin-icon');
            const addBtn = document.getElementById('add-item-btn');
            const themeBtn = document.getElementById('theme-btn');
            const musicBtn = document.getElementById('music-btn');
            if (isAdmin) {
                icon.className = "fa-solid fa-unlock text-lg text-emerald-400 group-hover:scale-110 transition-transform";
                showAdminButtons(true);
                setHeaderEditable(true);
                showToast("Admin mode activated!");
            } else {
                icon.className = "fa-solid fa-lock text-lg group-hover:scale-110 transition-transform";
                showAdminButtons(false);
                setHeaderEditable(false);
                siteConfig.title = document.getElementById('hero-title').innerText.trim();
                siteConfig.desc = document.getElementById('hero-desc').innerText.trim();
                localStorage.setItem('hub_config', JSON.stringify(siteConfig));
                showToast("Admin mode deactivated. Changes saved.", "info");
            }
            renderItems();
            renderHeroLinks();
        }

        function showAdminButtons(show) {
            const btns = ['add-item-btn', 'theme-btn', 'music-btn', 'hero-img-btn'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if (show) { el.classList.remove('hidden'); el.classList.add('flex'); }
                else { el.classList.remove('flex'); el.classList.add('hidden'); }
            });
        }

        function setHeaderEditable(on) {
            const title = document.getElementById('hero-title');
            const desc = document.getElementById('hero-desc');
            const titleEditBtn = document.getElementById('title-edit-btn');
            title.contentEditable = on;
            desc.contentEditable = on;
            if (on) {
                title.classList.add('border', 'border-blue-500/50', 'bg-slate-900/40');
                desc.classList.add('border', 'border-blue-500/50', 'bg-slate-900/40');
                titleEditBtn.classList.remove('hidden');
            } else {
                title.classList.remove('border', 'border-blue-500/50', 'bg-slate-900/40');
                desc.classList.remove('border', 'border-blue-500/50', 'bg-slate-900/40');
                titleEditBtn.classList.add('hidden');
            }
        }

        function enableAdminMode() {
            isAdmin = true;
            document.getElementById('admin-icon').className = "fa-solid fa-unlock text-lg text-emerald-400 group-hover:scale-110 transition-transform";
            showAdminButtons(true);
            setHeaderEditable(true);
            renderItems();
            renderHeroLinks();
        }

        // ===== Hero Links =====
        function renderHeroLinks() {
            const container = document.getElementById('hero-links-container');
            const adminControls = document.getElementById('hero-image-admin-controls');
            container.innerHTML = '';
            heroLinks.forEach((link, index) => {
                const w = link.width || 120;
                const h = link.height || 120;
                const radius = link.shape === 'square' ? '12px' : '50%';
                const div = document.createElement('div');
                div.className = 'relative group inline-block';
                div.innerHTML = `
                    <a href="${escapeAttr(link.link || '#')}" target="_blank" rel="noopener noreferrer" class="inline-block transition-all duration-300 group-hover:scale-110">
                        <img src="${escapeAttr(link.image)}" alt="Link" class="object-cover border border-themed shadow-xl glow-card transition-all" style="width:${w}px;height:${h}px;border-radius:${radius}">
                    </a>
                    ${isAdmin ? `
                        <div class="absolute -top-2 -right-2 z-20 flex gap-1">
                            <button onclick="editHeroLink(${index})" class="w-7 h-7 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Edit">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="moveHeroLink(${index}, -1)" class="w-7 h-7 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Move left">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                            <button onclick="moveHeroLink(${index}, 1)" class="w-7 h-7 rounded-full bg-slate-800/90 hover:accent-bg text-slate-200 hover:text-white flex items-center justify-center transition" title="Move right">
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                            <button onclick="deleteHeroLink(${index})" class="w-7 h-7 rounded-full bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white flex items-center justify-center transition" title="Delete">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
            if (isAdmin) adminControls.classList.remove('hidden');
            else adminControls.classList.add('hidden');
        }

        function openHeroImageModal() {
            document.getElementById('hero-modal-title').innerText = 'Add New Link';
            document.getElementById('hero-save-btn-text').innerText = 'Add Link';
            document.getElementById('hero-img-edit-index').value = '-1';
            document.getElementById('hero-img-url').value = '';
            document.getElementById('hero-img-link').value = '';
            document.getElementById('hero-img-width').value = 120;
            document.getElementById('hero-img-width-val').innerText = '120px';
            document.getElementById('hero-img-height').value = 120;
            document.getElementById('hero-img-height-val').innerText = '120px';
            setHeroImgShape('circle');
            document.getElementById('hero-img-preview-container').classList.add('hidden');
            const m = document.getElementById('hero-image-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeHeroImageModal() {
            const m = document.getElementById('hero-image-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        function editHeroLink(index) {
            const link = heroLinks[index];
            document.getElementById('hero-modal-title').innerText = 'Edit Link';
            document.getElementById('hero-save-btn-text').innerText = 'Update Link';
            document.getElementById('hero-img-edit-index').value = String(index);
            document.getElementById('hero-img-url').value = link.image || '';
            document.getElementById('hero-img-link').value = link.link || '';
            document.getElementById('hero-img-width').value = link.width || 120;
            document.getElementById('hero-img-width-val').innerText = (link.width || 120) + 'px';
            document.getElementById('hero-img-height').value = link.height || 120;
            document.getElementById('hero-img-height-val').innerText = (link.height || 120) + 'px';
            setHeroImgShape(link.shape || 'circle');
            previewHeroImage();
            const m = document.getElementById('hero-image-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function setHeroImgShape(shape) {
            ['hero-img-shape-circle-btn', 'hero-img-shape-square-btn'].forEach(id => {
                const b = document.getElementById(id); if (b) b.classList.remove('accent-bg', 'text-white');
            });
            const b = document.getElementById('hero-img-shape-' + shape + '-btn'); if (b) b.classList.add('accent-bg', 'text-white');
            const img = document.getElementById('hero-img-preview');
            if (img) img.style.borderRadius = shape === 'square' ? '12px' : '50%';
        }

        function previewHeroImage() {
            const url = document.getElementById('hero-img-url').value;
            const container = document.getElementById('hero-img-preview-container');
            const img = document.getElementById('hero-img-preview');
            if (url) {
                img.src = url;
                const w = parseInt(document.getElementById('hero-img-width').value);
                const h = parseInt(document.getElementById('hero-img-height').value);
                img.style.width = w + 'px';
                img.style.height = h + 'px';
                container.classList.remove('hidden');
                img.onerror = () => container.classList.add('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function saveHeroImage() {
            const image = document.getElementById('hero-img-url').value.trim();
            const link = document.getElementById('hero-img-link').value.trim();
            const width = parseInt(document.getElementById('hero-img-width').value);
            const height = parseInt(document.getElementById('hero-img-height').value);
            const shapeEl = document.querySelector('#hero-img-shape-circle-btn.accent-bg, #hero-img-shape-square-btn.accent-bg');
            const shape = shapeEl && shapeEl.id.includes('square') ? 'square' : 'circle';
            if (!image) {
                showToast("Please provide an image URL.", "error");
                return;
            }
            const idx = parseInt(document.getElementById('hero-img-edit-index').value);
            const data = { image, link, width, height, shape };
            if (idx >= 0) {
                heroLinks[idx] = data;
                showToast("Link updated!");
            } else {
                heroLinks.push(data);
                showToast("Link added!");
            }
            localStorage.setItem('hub_hero_links', JSON.stringify(heroLinks));
            renderHeroLinks();
            closeHeroImageModal();
        }

        function moveHeroLink(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= heroLinks.length) return;
            const item = heroLinks.splice(index, 1)[0];
            heroLinks.splice(newIndex, 0, item);
            localStorage.setItem('hub_hero_links', JSON.stringify(heroLinks));
            renderHeroLinks();
        }

        function deleteHeroLink(index) {
            heroLinks.splice(index, 1);
            localStorage.setItem('hub_hero_links', JSON.stringify(heroLinks));
            renderHeroLinks();
            showToast("Link removed.", "info");
        }

        // ===== Title Settings =====
        function applyTitleConfig() {
            const title = document.getElementById('hero-title');
            const wrapper = document.getElementById('title-wrapper');
            const hero = document.getElementById('hero-section');
            const content = document.getElementById('hero-content');
            title.style.fontSize = (titleConfig.fontSize || 72) + 'px';
            title.style.lineHeight = '1.1';
            content.classList.remove('text-left', 'text-center', 'text-right');
            content.classList.add('text-' + (titleConfig.align || 'center'));
            const pos = titleConfig.pos || 'center';
            if (pos === 'top') {
                hero.classList.remove('justify-center', 'justify-end');
                hero.classList.add('justify-start', 'pt-20');
            } else if (pos === 'bottom') {
                hero.classList.remove('justify-start', 'justify-center', 'pt-20');
                hero.classList.add('justify-end', 'pb-20');
            } else {
                hero.classList.remove('justify-start', 'justify-end', 'pt-20', 'pb-20');
                hero.classList.add('justify-center');
            }
            content.style.marginTop = (titleConfig.marginTop || 0) + 'px';
        }

        function openTitleSettings() {
            document.getElementById('title-text-input').value = siteConfig.title;
            document.getElementById('title-font-size').value = titleConfig.fontSize || 72;
            document.getElementById('title-font-size-val').innerText = (titleConfig.fontSize || 72) + 'px';
            document.getElementById('title-pos-select').value = titleConfig.pos || 'center';
            document.getElementById('title-margin').value = titleConfig.marginTop || 0;
            document.getElementById('title-margin-val').innerText = (titleConfig.marginTop || 0) + 'px';
            setTitleAlign(titleConfig.align || 'center');
            const m = document.getElementById('title-settings-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeTitleSettings() {
            const m = document.getElementById('title-settings-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        function setTitleAlign(align) {
            ['title-align-left-btn', 'title-align-center-btn', 'title-align-right-btn'].forEach(id => {
                const b = document.getElementById(id); if (b) b.classList.remove('accent-bg', 'text-white');
            });
            const b = document.getElementById('title-align-' + align + '-btn'); if (b) b.classList.add('accent-bg', 'text-white');
        }

        function saveTitleSettings() {
            const text = document.getElementById('title-text-input').value.trim() || "CREATED BY fmi774";
            const fontSize = parseInt(document.getElementById('title-font-size').value);
            const pos = document.getElementById('title-pos-select').value;
            const marginTop = parseInt(document.getElementById('title-margin').value);
            const alignEl = document.querySelector('#title-align-left-btn.accent-bg, #title-align-center-btn.accent-bg, #title-align-right-btn.accent-bg');
            let align = 'center';
            if (alignEl && alignEl.id.includes('left')) align = 'left';
            else if (alignEl && alignEl.id.includes('right')) align = 'right';
            siteConfig.title = text;
            siteConfig.headerAlign = align;
            siteConfig.headerPos = pos;
            titleConfig = { fontSize, align, pos, marginTop };
            localStorage.setItem('hub_config', JSON.stringify(siteConfig));
            localStorage.setItem('hub_title_config', JSON.stringify(titleConfig));
            renderConfig();
            applyTitleConfig();
            closeTitleSettings();
            showToast("Title settings saved!");
        }

        // ===== Add / Edit Item =====
        function openAddModal() {
            editingIndex = -1;
            document.getElementById('add-modal-title').innerText = "Add Module";
            document.getElementById('save-btn-text').innerText = "Save Module";
            document.getElementById('add-form').reset();
            document.getElementById('edit-index').value = "-1";
            document.getElementById('image-preview-container').classList.add('hidden');
            const m = document.getElementById('add-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeAddModal() {
            const m = document.getElementById('add-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        function editItem(index) {
            const item = items[index];
            editingIndex = index;
            document.getElementById('add-modal-title').innerText = "Edit Module";
            document.getElementById('save-btn-text').innerText = "Update Module";
            document.getElementById('item-title').value = item.title;
            document.getElementById('item-desc').value = item.desc;
            document.getElementById('item-link').value = item.link;
            document.getElementById('item-image').value = item.image;
            document.getElementById('item-img-size').value = item.imgSize || 'medium';
            document.getElementById('item-link-type').value = item.linkType || 'play';
            document.getElementById('edit-index').value = String(index);
            previewCardImage();
            const m = document.getElementById('add-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function previewCardImage() {
            const url = document.getElementById('item-image').value;
            const container = document.getElementById('image-preview-container');
            const img = document.getElementById('image-preview');
            if (url) {
                img.src = url;
                container.classList.remove('hidden');
                img.onerror = () => container.classList.add('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function handleSaveItem(e) {
            e.preventDefault();
            const data = {
                title: document.getElementById('item-title').value,
                desc: document.getElementById('item-desc').value,
                link: document.getElementById('item-link').value,
                image: document.getElementById('item-image').value,
                imgSize: document.getElementById('item-img-size').value,
                linkType: document.getElementById('item-link-type').value
            };
            const idx = parseInt(document.getElementById('edit-index').value);
            if (idx >= 0) {
                items[idx] = data;
                showToast("Module updated!");
            } else {
                items.push(data);
                showToast("Module added!");
            }
            saveAndRefresh();
            closeAddModal();
        }

        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= items.length) return;
            const item = items.splice(index, 1)[0];
            items.splice(newIndex, 0, item);
            localStorage.setItem('hub_items', JSON.stringify(items));
            renderItems();
        }

        function deleteItem(index) {
            if (confirm("Delete this module?")) {
                items.splice(index, 1);
                saveAndRefresh();
                showToast("Module deleted.", "info");
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('hub_items', JSON.stringify(items));
            renderItems();
        }

        // ===== Detail Modal =====
        function openDetailModal(index) {
            const item = items[index];
            document.getElementById('detail-content').innerHTML = `
                <h2 class="text-2xl md:text-3xl font-extrabold text-white">${escapeHtml(item.title)}</h2>
                <p class="muted-text leading-relaxed">${escapeHtml(item.desc)}</p>
                <a href="${escapeAttr(item.link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 accent-bg hover:opacity-90 text-white font-medium px-6 py-3 rounded-full transition">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Link
                </a>`;
            const m = document.getElementById('detail-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeDetailModal() {
            const m = document.getElementById('detail-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        // ===== Music =====
        function loadMusicState() {
            const audio = document.getElementById('bg-audio');
            audio.volume = (musicConfig.volume || 70) / 100;
            const volSlider = document.getElementById('music-volume-2');
            if (volSlider) volSlider.value = musicConfig.volume || 70;
            if (musicConfig.songs && musicConfig.songs.length > 0) {
                document.getElementById('hero-music-controls').classList.remove('hidden');
                playSong(currentSongIndex);
            }
        }

        function renderSongsList() {
            const list = document.getElementById('music-songs-list');
            if (!musicConfig.songs || musicConfig.songs.length === 0) {
                list.innerHTML = '<p class="text-sm muted-text text-center py-2">No songs added yet.</p>';
                return;
            }
            list.innerHTML = musicConfig.songs.map((song, i) => `
                <div class="flex items-center gap-2 bg-slate-900 border border-themed rounded-lg px-3 py-2">
                    <i class="fa-solid fa-music accent-text text-sm shrink-0"></i>
                    <span class="text-sm flex-1 truncate">${escapeHtml(song.title || 'Song ' + (i + 1))}</span>
                    <button onclick="playSong(${i})" class="text-slate-400 hover:accent-text w-7 h-7 flex items-center justify-center transition shrink-0" title="Play">
                        <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    <button onclick="deleteSong(${i})" class="text-slate-400 hover:text-rose-400 w-7 h-7 flex items-center justify-center transition shrink-0" title="Delete">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function toggleMusicPanel() {
            const m = document.getElementById('music-modal');
            if (m.classList.contains('hidden')) {
                document.getElementById('music-url').value = '';
                document.getElementById('music-title').value = '';
                document.getElementById('music-file').value = '';
                renderSongsList();
                document.getElementById('shuffle-status').innerText = musicConfig.shuffle ? 'On' : 'Off';
                m.classList.remove('hidden'); m.classList.add('flex');
            } else {
                closeMusicModal();
            }
        }

        function closeMusicModal() {
            const m = document.getElementById('music-modal');
            m.classList.remove('flex'); m.classList.add('hidden');
        }

        function addSong() {
            const url = document.getElementById('music-url').value.trim();
            const fileInput = document.getElementById('music-file');
            const title = document.getElementById('music-title').value.trim() || ("Song " + ((musicConfig.songs || []).length + 1));
            if (!musicConfig.songs) musicConfig.songs = [];

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    musicConfig.songs.push({ url: e.target.result, title, isData: true });
                    saveMusicConfig();
                    renderSongsList();
                    document.getElementById('music-url').value = '';
                    document.getElementById('music-title').value = '';
                    document.getElementById('music-file').value = '';
                    document.getElementById('hero-music-controls').classList.remove('hidden');
                    if (musicConfig.songs.length === 1) playSong(0);
                    showToast("Song added!");
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (url) {
                musicConfig.songs.push({ url, title, isData: false });
                saveMusicConfig();
                renderSongsList();
                document.getElementById('music-url').value = '';
                document.getElementById('music-title').value = '';
                document.getElementById('hero-music-controls').classList.remove('hidden');
                if (musicConfig.songs.length === 1) playSong(0);
                showToast("Song added!");
            } else {
                showToast("Please provide a URL or upload a file.", "error");
            }
        }

        function deleteSong(index) {
            musicConfig.songs.splice(index, 1);
            saveMusicConfig();
            renderSongsList();
            if (musicConfig.songs.length === 0) {
                document.getElementById('hero-music-controls').classList.add('hidden');
                const audio = document.getElementById('bg-audio');
                audio.pause();
                audio.src = '';
            } else if (currentSongIndex >= musicConfig.songs.length) {
                playSong(0);
            }
            showToast("Song removed.", "info");
        }

        function saveMusicConfig() {
            localStorage.setItem('hub_music', JSON.stringify(musicConfig));
        }

        function playSong(index) {
            if (!musicConfig.songs || musicConfig.songs.length === 0) return;
            currentSongIndex = index;
            const song = musicConfig.songs[index];
            const audio = document.getElementById('bg-audio');
            audio.src = song.url;
            audio.volume = (musicConfig.volume || 70) / 100;
            document.getElementById('now-playing-title-2').innerText = song.title || "Now Playing";
            audio.play().catch(() => showToast("Click again — browsers block auto-play.", "error"));
            updatePlayIcon(true);
        }

        function toggleShuffleMode() {
            musicConfig.shuffle = !musicConfig.shuffle;
            saveMusicConfig();
            document.getElementById('shuffle-status').innerText = musicConfig.shuffle ? 'On' : 'Off';
            showToast("Shuffle " + (musicConfig.shuffle ? "enabled" : "disabled"), "info");
        }

        function shuffleMusic() {
            if (!musicConfig.songs || musicConfig.songs.length === 0) return;
            let nextIndex;
            if (musicConfig.shuffle && musicConfig.songs.length > 1) {
                do { nextIndex = Math.floor(Math.random() * musicConfig.songs.length); }
                while (nextIndex === currentSongIndex);
            } else {
                nextIndex = (currentSongIndex + 1) % musicConfig.songs.length;
            }
            playSong(nextIndex);
        }

        function nextSong() {
            if (!musicConfig.songs || musicConfig.songs.length === 0) return;
            const nextIndex = (currentSongIndex + 1) % musicConfig.songs.length;
            playSong(nextIndex);
        }

        function togglePlayMusic() {
            const audio = document.getElementById('bg-audio');
            if (!audio.src) {
                if (musicConfig.songs && musicConfig.songs.length > 0) playSong(0);
                return;
            }
            if (audio.paused) {
                audio.play().catch(() => showToast("Click again — browsers block auto-play.", "error"));
                updatePlayIcon(true);
            } else {
                audio.pause();
                updatePlayIcon(false);
            }
        }

        function updatePlayIcon(playing) {
            const icon = document.getElementById('play-icon-2');
            if (icon) icon.className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        }

        function seekMusic(id) {
            const audio = document.getElementById('bg-audio');
            const seek = document.getElementById('music-seek-2');
            if (seek && audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
        }

        function setVolume(id) {
            const audio = document.getElementById('bg-audio');
            const vol = document.getElementById('music-volume-2');
            if (vol) {
                const v = parseInt(vol.value);
                audio.volume = v / 100;
                musicConfig.volume = v;
                saveMusicConfig();
            }
        }

        // Auto-update seek bar + auto-advance to next song
        const bgAudio = document.getElementById('bg-audio');
        if (bgAudio) {
            bgAudio.addEventListener('ended', () => {
                if (musicConfig.songs && musicConfig.songs.length > 1) {
                    shuffleMusic();
                }
            });
        }
        setInterval(() => {
            const audio = document.getElementById('bg-audio');
            const seek = document.getElementById('music-seek-2');
            if (seek && audio.duration && !audio.paused) {
                seek.value = (audio.currentTime / audio.duration) * 100;
            }
        }, 500);

        // ===== Utils =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
